name: Build

# Builds the downloads for macOS, Windows and Linux and uploads them as
# workflow artifacts. Run it by hand from the Actions tab for a test build,
# or let the Release workflow call it (that is how releases are built).
#
#   macOS    emugrid-<version>-macos-universal.dmg  (Apple silicon + Intel)
#   Windows  emugrid-<version>-windows-x86_64.zip
#   Linux    emugrid-<version>-linux-x86_64.tar.gz
#
# Builds are unsigned. The macOS app gets an ad-hoc signature so Gatekeeper
# offers "Open Anyway" instead of calling it damaged.
on:
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        description: Commit to build (defaults to the triggering commit).
        type: string
        default: ""

permissions:
  contents: read

env:
  # Lightweight is the point of emugrid: fail if a binary grows past this.
  MAX_BINARY_BYTES: 8388608

jobs:
  build:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macos-universal
            os: macos-latest
            targets: aarch64-apple-darwin,x86_64-apple-darwin
          - name: windows-x86_64
            os: windows-latest
            targets: x86_64-pc-windows-msvc
          - name: linux-x86_64
            os: ubuntu-22.04 # older glibc, so the binary runs on more distros
            targets: x86_64-unknown-linux-gnu
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.targets }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.name }}
      - name: Linux GUI deps
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libgl1-mesa-dev libwayland-dev

      - name: Build
        run: |
          for target in $(echo '${{ matrix.targets }}' | tr ',' ' '); do
            cargo build --release --locked --target "$target"
          done

      - name: Size budget
        run: |
          for target in $(echo '${{ matrix.targets }}' | tr ',' ' '); do
            bin="target/$target/release/emugrid"
            [ -f "$bin" ] || bin="$bin.exe"
            size=$(wc -c < "$bin" | tr -d ' ')
            echo "### $target: $((size / 1024)) KiB" >> "$GITHUB_STEP_SUMMARY"
            if [ "$size" -gt "$MAX_BINARY_BYTES" ]; then
              echo "::error::$target binary is $size bytes, over the $MAX_BINARY_BYTES byte budget"
              exit 1
            fi
          done

      - name: Package
        run: |
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n 1)
          name="emugrid-${version}-${{ matrix.name }}"
          mkdir -p dist
          case "${{ runner.os }}" in
            macOS)
              app="stage/emugrid.app/Contents"
              mkdir -p "$app/MacOS"
              lipo -create -output "$app/MacOS/emugrid" \
                target/aarch64-apple-darwin/release/emugrid \
                target/x86_64-apple-darwin/release/emugrid
              sed "s/__VERSION__/$version/g" packaging/macos/Info.plist > "$app/Info.plist"
              codesign --force --deep --sign - stage/emugrid.app
              ln -s /Applications stage/Applications
              hdiutil create -volname emugrid -srcfolder stage -ov -format UDZO "dist/$name.dmg"
              ;;
            Windows)
              cp target/x86_64-pc-windows-msvc/release/emugrid.exe dist/
              (cd dist && 7z a -tzip "$name.zip" emugrid.exe >/dev/null && rm emugrid.exe)
              ;;
            Linux)
              cp target/x86_64-unknown-linux-gnu/release/emugrid dist/
              (cd dist && tar czf "$name.tar.gz" emugrid && rm emugrid)
              ;;
          esac
          ls -l dist

      - uses: actions/upload-artifact@v4
        with:
          name: emugrid-${{ matrix.name }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14
