[package]
name = "emugrid"
version = "0.1.0"
edition = "2024"
description = "A tiny, cross-platform dashboard to see and control all your Android emulators in one place."
license = "MIT"
readme = "README.md"
keywords = ["android", "emulator", "adb", "avd", "devtools"]
categories = ["development-tools"]

[dependencies]
bytes = "1.12.1"
eframe = { version = "0.37", default-features = false, features = ["default_fonts", "glow", "x11", "wayland"] }
h2 = "0.4.20"
http = "1.5.0"
png = "0.18.1"
tokio = { version = "1.54.1", default-features = false, features = ["rt", "net", "time", "io-util"] }

# Keep the shipped binary small: this is the project's main goal.
[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
