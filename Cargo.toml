[package]
name = "emugrid"
version = "0.2.1"
edition = "2024"
description = "A tiny, cross-platform dashboard to see and control all your Android emulators in one place."
license = "MIT"
readme = "README.md"
keywords = ["android", "emulator", "adb", "avd", "devtools"]
categories = ["development-tools"]

[dependencies]
bytes = "1.12.1"
egui = { version = "0.37", default-features = false }
eframe = { version = "0.37", default-features = false, features = ["glow", "x11", "wayland"] }
h2 = "0.4.20"
http = "1.5.0"
image = { version = "0.25.10", default-features = false, features = ["jpeg"] }
png = "0.18.1"
serde_json = "1.0"
tokio = { version = "1.54.1", default-features = false, features = ["rt", "net", "time", "io-util"] }
ureq = { version = "3.5.2", default-features = false, features = ["json"] }

# Keep the shipped binary small: this is the project's main goal.
[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
